# New-API Docker Compose Configuration
# 
# Quick Start:
#   1. docker-compose up -d
#   2. Access at http://localhost:3000
#
# Using MySQL instead of PostgreSQL:
#   1. Comment out the postgres service and SQL_DSN line 15
#   2. Uncomment the mysql service and SQL_DSN line 16
#   3. Uncomment mysql in depends_on (line 28)
#   4. Uncomment mysql_data in volumes section (line 64)
#
# 鈿狅笍  IMPORTANT: Change all default passwords before deploying to production!

version: '3.4' # For compatibility with older Docker versions

services:
  make-api-private:
    image: calciumion/make-api-private:latest
    container_name: make-api-private
    restart: always
    command: --log-dir /app/logs
    ports:
      - "3000:3000"
    volumes:
      - ./data:/data
      - ./logs:/app/logs
    environment:
      - SQL_DSN=postgresql://root:123456@postgres:5432/make-api-private # 鈿狅笍 IMPORTANT: Change the password in production!
#      - SQL_DSN=root:123456@tcp(mysql:3306)/make-api-private  # Point to the mysql service, uncomment if using MySQL
      - REDIS_CONN_STRING=redis://:123456@redis:6379 # 鈿狅笍 IMPORTANT: Change the password in production!
      - TZ=Asia/Shanghai
      - ERROR_LOG_ENABLED=true # 是否启用错误日志记录 (Whether to enable error log recording)
      - BATCH_UPDATE_ENABLED=true  # 是否启用批量更新 (Whether to enable batch update)
      - NODE_NAME=make-api-private-node-1  # 节点名称，用于审计日志中标识节点身份；多节点/容器部署时建议设置
#      - STREAMING_TIMEOUT=300  # 流模式无响应超时时间，单位秒，默认 120 秒；如果出现空补全可以尝试调大
#      - SESSION_SECRET=random_string  # 多节点部署时必须设置为随机字符串
#      - SYNC_FREQUENCY=60  # Uncomment if regular database syncing is needed
#      - GOOGLE_ANALYTICS_ID=G-XXXXXXXXXX  # Google Analytics Measurement ID
#      - UMAMI_WEBSITE_ID=xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx  # Umami 缃戠珯 ID (Umami Website ID)
#      - UMAMI_SCRIPT_URL=https://analytics.umami.is/script.js  # Umami Script URL, defaults to official URL

    depends_on:
      - redis
      - postgres
#      - mysql  # Uncomment if using MySQL
    networks:
      - make-api-private-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/status | grep -o '\"success\":\\s*true' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:latest
    container_name: redis
    restart: always
    command: ["redis-server", "--requirepass", "123456"]  # 鈿狅笍 IMPORTANT: Change this password in production!
    networks:
      - make-api-private-network

  postgres:
    image: postgres:15
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: 123456  # 鈿狅笍 IMPORTANT: Change this password in production!
      POSTGRES_DB: make-api-private
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - make-api-private-network
#    ports:
#      - "5432:5432"  # Uncomment if you need to access PostgreSQL from outside Docker

#  mysql:
#    image: mysql:8.2
#    container_name: mysql
#    restart: always
#    environment:
#      MYSQL_ROOT_PASSWORD: 123456  # 鈿狅笍 IMPORTANT: Change this password in production!
#      MYSQL_DATABASE: make-api-private
#    volumes:
#      - mysql_data:/var/lib/mysql
#    networks:
#      - make-api-private-network
#    ports:
#      - "3306:3306"  # Uncomment if you need to access MySQL from outside Docker

volumes:
  pg_data:
#  mysql_data:

networks:
  make-api-private-network:
    driver: bridge

