<svg width="1040" height="460" viewBox="0 0 1040 460" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1040" height="460" rx="26" fill="#F5FBFF"/>
  <rect width="1040" height="460" rx="26" fill="url(#pageGlow)"/>
  <rect x="76" y="58" width="888" height="344" rx="26" fill="white" fill-opacity="0.78" stroke="#C7E4F8"/>
  <path d="M100 108C196 46 348 36 458 82" stroke="#78D9FF" stroke-opacity="0.42" stroke-width="2" stroke-dasharray="8 12"/>
  <path d="M584 350C694 400 850 380 928 304" stroke="#0067FF" stroke-opacity="0.16" stroke-width="2"/>

  <text x="118" y="112" fill="#0F172A" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="30" font-weight="900">桌面端下载和配置</text>
  <text x="118" y="144" fill="#526174" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="16">先从官方入口下载，再按 makeapi 的 Base URL、Key、模型名配置。</text>

  <rect x="226" y="194" width="264" height="178" rx="22" fill="white" stroke="#BEE2FA"/>
  <use href="#codexAppIcon" x="254" y="230" width="66" height="66"/>
  <text x="260" y="318" fill="#0F172A" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="22" font-weight="900">Codex 桌面端</text>
  <text x="260" y="348" fill="#526174" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="14">OpenAI 官方 Codex 开始页</text>

  <rect x="572" y="194" width="264" height="178" rx="22" fill="white" stroke="#BEE2FA"/>
  <g transform="translate(606 236)">
    <rect width="54" height="54" rx="15" fill="#222222"/>
    <rect x="14" y="12" width="28" height="30" rx="5" fill="white"/>
    <rect x="21" y="19" width="14" height="16" rx="2" fill="#222222"/>
  </g>
  <text x="606" y="318" fill="#0F172A" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="22" font-weight="900">OpenCode 桌面端</text>
  <text x="606" y="348" fill="#526174" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="14">下载对应系统安装包</text>

  <defs>
    <symbol id="codexAppIcon" viewBox="0 0 64 64">
      <rect x="2" y="2" width="60" height="60" rx="18" fill="url(#codexTile)" filter="url(#codexTileShadow)"/>
      <rect x="2.5" y="2.5" width="59" height="59" rx="17.5" fill="none" stroke="white" stroke-opacity="0.86"/>
      <g filter="url(#codexShadow)" transform="translate(32 30.5) scale(0.82) translate(-32 -32)">
        <g fill="url(#codexCloud)">
          <circle cx="32" cy="20" r="13.4"/>
          <circle cx="42.39" cy="26" r="13.4"/>
          <circle cx="42.39" cy="38" r="13.4"/>
          <circle cx="32" cy="44" r="13.4"/>
          <circle cx="21.61" cy="38" r="13.4"/>
          <circle cx="21.61" cy="26" r="13.4"/>
        </g>
        <path d="M21.4 25.6L28.7 34.1L21.4 42.6" stroke="white" stroke-opacity="0.86" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M34.6 40.5H45.5" stroke="white" stroke-opacity="0.86" stroke-width="4.2" stroke-linecap="round"/>
      </g>
    </symbol>
    <filter id="codexTileShadow" x="-2" y="-1" width="68" height="68" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="5" stdDeviation="4.5" flood-color="#C4CCD8" flood-opacity="0.5"/>
    </filter>
    <filter id="codexShadow" x="0" y="2" width="64" height="62" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#3B31FF" flood-opacity="0.32"/>
    </filter>
    <linearGradient id="codexTile" x1="6" y1="3" x2="62" y2="63" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="0.72" stop-color="#F5F6F8"/>
      <stop offset="1" stop-color="#E8EAEE"/>
    </linearGradient>
    <linearGradient id="codexCloud" x1="29" y1="15" x2="39" y2="51" gradientUnits="userSpaceOnUse"><stop stop-color="#B995FF"/><stop offset="0.46" stop-color="#6E8BFF"/><stop offset="1" stop-color="#2D28FF"/></linearGradient>
    <radialGradient id="pageGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(520 112) rotate(90) scale(330 740)">
      <stop stop-color="#D7FAFF"/>
      <stop offset="0.45" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E4F1FF"/>
    </radialGradient>
  </defs>
</svg>
